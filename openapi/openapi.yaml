openapi: 3.0.3
info:
  title: Cooperative Voting API
  version: v1
  description: API de domínio e contratos de apresentação mobile.
servers:
  - url: http://localhost:8080
    description: Local
  - url: https://{host}
    description: Cloud configurável
    variables:
      host:
        default: api.example.com
        description: Host HTTPS fornecido pelo ambiente de deploy
tags:
  - name: Pautas
  - name: Sessões
  - name: Votos
  - name: Resultados
  - name: Mobile UI
paths:
  /api/v1/agendas:
    post:
      tags: [Pautas]
      summary: Cadastra uma pauta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgendaRequest"
            example:
              title: Aprovação do orçamento anual
              description: Orçamento do próximo exercício
      responses:
        "201":
          description: Pauta criada; inclui header Location.
          headers:
            Location:
              schema: {type: string, format: uri}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Agenda"}
        "400": {$ref: "#/components/responses/BadRequest"}
    get:
      tags: [Pautas]
      summary: Lista pautas
      responses:
        "200":
          description: Lista por criação decrescente.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Agenda"}
  /api/v1/agendas/{agendaId}:
    parameters:
      - $ref: "#/components/parameters/AgendaId"
    get:
      tags: [Pautas]
      summary: Consulta pauta
      responses:
        "200":
          description: Pauta encontrada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Agenda"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/agendas/{agendaId}/sessions:
    parameters:
      - $ref: "#/components/parameters/AgendaId"
    post:
      tags: [Sessões]
      summary: Abre a única sessão da pauta
      description: Body ou duração omitida usa um minuto.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenSessionRequest"
            examples:
              default: {value: {}}
              custom: {value: {durationMinutes: 5}}
      responses:
        "201":
          description: Sessão aberta; inclui header Location.
          headers:
            Location:
              schema: {type: string, format: uri}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VotingSession"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/agendas/{agendaId}/sessions/current:
    parameters:
      - $ref: "#/components/parameters/AgendaId"
    get:
      tags: [Sessões]
      summary: Consulta a sessão da pauta
      responses:
        "200":
          description: Estado calculado no instante da consulta.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VotingSession"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/agendas/{agendaId}/votes:
    parameters:
      - $ref: "#/components/parameters/AgendaId"
    post:
      tags: [Votos]
      summary: Registra voto
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterVoteRequest"}
            example: {associateId: "12345678901", choice: SIM}
      responses:
        "201":
          description: Voto persistido e tela mobile de confirmação.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FormScreen"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/agendas/{agendaId}/results:
    parameters:
      - $ref: "#/components/parameters/AgendaId"
    get:
      tags: [Resultados]
      summary: Consulta contagem e resultado
      responses:
        "200":
          description: Parcial durante a sessão e final após fechamento.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VotingResult"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/mobile/agendas:
    get:
      tags: [Mobile UI]
      summary: Tela de seleção de pautas
      responses:
        "200":
          description: Tela SELECAO.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SelectionScreen"}
  /api/v1/mobile/agendas/{agendaId}/identify:
    parameters:
      - $ref: "#/components/parameters/AgendaId"
    post:
      tags: [Mobile UI]
      summary: Tela de identificação
      responses:
        "200":
          description: Tela FORMULARIO com INPUT_TEXTO.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FormScreen"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/mobile/agendas/{agendaId}/vote-options:
    parameters:
      - $ref: "#/components/parameters/AgendaId"
    post:
      tags: [Mobile UI]
      summary: Verifica elegibilidade e apresenta SIM/NAO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [associateId]
              properties:
                agendaId: {type: string, format: uuid}
                associateId: {type: string, pattern: '^\d{11}$'}
            example: {associateId: "12345678901"}
      responses:
        "200":
          description: Tela SELECAO com opções.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SelectionScreen"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
components:
  parameters:
    AgendaId:
      name: agendaId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: Request inválido.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: Pauta não encontrada.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: Regra de sessão ou voto em conflito.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unprocessable:
      description: CPF inválido ou associado não habilitado.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unavailable:
      description: Elegibilidade indisponível.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    CreateAgendaRequest:
      type: object
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 150}
        description: {type: string, maxLength: 2000, nullable: true}
    Agenda:
      type: object
      required: [id, title, createdAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    OpenSessionRequest:
      type: object
      properties:
        durationMinutes: {type: integer, format: int64, minimum: 1, maximum: 1440}
    VotingSession:
      type: object
      required: [id, agendaId, openedAt, closesAt, requestedDurationSeconds, status]
      properties:
        id: {type: string, format: uuid}
        agendaId: {type: string, format: uuid}
        openedAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time}
        requestedDurationSeconds: {type: integer, format: int64}
        status: {$ref: "#/components/schemas/SessionStatus"}
    SessionStatus:
      type: string
      enum: [NOT_STARTED, OPEN, CLOSED]
    RegisterVoteRequest:
      type: object
      required: [associateId, choice]
      properties:
        associateId: {type: string, pattern: '^\d{11}$', example: "12345678901"}
        choice: {type: string, enum: [SIM, NAO]}
    VotingResult:
      type: object
      required: [agendaId, sessionId, sessionStatus, yesVotes, noVotes, totalVotes, outcome]
      properties:
        agendaId: {type: string, format: uuid}
        sessionId: {type: string, format: uuid}
        sessionStatus: {$ref: "#/components/schemas/SessionStatus"}
        yesVotes: {type: integer, format: int64}
        noVotes: {type: integer, format: int64}
        totalVotes: {type: integer, format: int64}
        outcome:
          type: string
          enum: [IN_PROGRESS, APPROVED, REJECTED, TIED]
    SelectionScreen:
      type: object
      required: [tipo, titulo, itens]
      properties:
        tipo: {type: string, enum: [SELECAO]}
        titulo: {type: string}
        itens:
          type: array
          items:
            $ref: "#/components/schemas/SelectionItem"
    SelectionItem:
      type: object
      required: [texto, url, body]
      properties:
        texto: {type: string}
        url: {type: string, format: uri}
        body: {type: object, additionalProperties: true}
    FormScreen:
      type: object
      required: [tipo, titulo, itens]
      properties:
        tipo: {type: string, enum: [FORMULARIO]}
        titulo: {type: string}
        itens:
          type: array
          items: {$ref: "#/components/schemas/FormItem"}
        botaoOk: {$ref: "#/components/schemas/Action"}
        botaoCancelar: {$ref: "#/components/schemas/Action"}
    FormItem:
      type: object
      required: [tipo]
      properties:
        tipo: {type: string, enum: [TEXTO, INPUT_TEXTO]}
        texto: {type: string}
        id: {type: string}
        titulo: {type: string}
        valor: {type: string}
    Action:
      type: object
      required: [texto, url]
      properties:
        texto: {type: string}
        url: {type: string, format: uri}
        body: {type: object, additionalProperties: true}
    Problem:
      type: object
      required: [type, title, status, detail, instance, code, timestamp, correlationId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        timestamp: {type: string, format: date-time}
        correlationId: {type: string}
        errors:
          type: object
          additionalProperties: {type: string}
