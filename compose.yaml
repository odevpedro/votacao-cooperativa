services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cooperative_voting}
      POSTGRES_USER: ${POSTGRES_USER:-cooperative}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cooperative}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cooperative_voting}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cooperative}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cooperative}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      VOTER_ELIGIBILITY_ENABLED: ${VOTER_ELIGIBILITY_ENABLED:-false}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
